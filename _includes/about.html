{% assign about = site.data.portfolio.about %}
<article class="about active" data-page="about">

  <header>
    <h2 class="h2 article-title">About me</h2>
  </header>

  <section class="about-text">
    {% for paragraph in about.bio %}
    <p>{{ paragraph }}</p>
    {% endfor %}
  </section>

</article>
